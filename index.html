<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atelier Bleu</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="4" fill="#1a1a2e"/>
        <rect x="8" y="8" width="14" height="14" rx="1" fill="white" opacity="0.9"/>
        <rect x="26" y="8" width="14" height="14" rx="1" fill="white" opacity="0.6"/>
        <rect x="8" y="26" width="14" height="14" rx="1" fill="white" opacity="0.6"/>
        <rect x="26" y="26" width="14" height="14" rx="1" fill="white" opacity="0.9"/>
      </svg>
    </div>
    <h1 class="site-title">ATELIER BLEU</h1>
    <p class="site-tagline">Un espace de création &amp; d'expérimentation.</p>
  </header>

  <main class="content">
    <div class="projects-grid">

      <div class="project-item">
        <span class="project-label">Projet 01</span>
        <a class="project-card" href="https://manu.atelier-bleu.com/">
          <div class="card-preview manu-preview">
            <div class="preview-inner">
              <div class="manu-keys">
                <div class="key white-key"></div>
                <div class="key black-key"></div>
                <div class="key white-key"></div>
                <div class="key white-key"></div>
                <div class="key black-key"></div>
                <div class="key white-key"></div>
                <div class="key black-key"></div>
                <div class="key white-key"></div>
              </div>
              <p class="preview-label">MANU</p>
            </div>
          </div>
          <div class="card-meta">
            <span class="card-title">Manu</span>
            <span class="card-arrow">↗</span>
          </div>
          <p class="card-desc">Beatmaker interactif — kick, hi-hat, synth &amp; layers gospel. 126 BPM.</p>
        </a>
      </div>

      <!-- Placeholder — duplicate pour ajouter un projet -->
